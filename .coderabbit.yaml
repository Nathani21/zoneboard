# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Explain the why behind each suggestion. The author is learning, so keep it clear and concrete."

reviews:
  profile: chill
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/*.png"
    - "!**/*.svg"
    - "!**/package-lock.json"
    - "!dist/**"
  path_instructions:
    - path: "src/zones.ts"
      instructions: >-
        Pure logic. Must not touch the DOM or browser storage (document, window,
        localStorage). Every exported function needs a doc comment and tests in
        src/zones.test.ts. Time-zone maths must use Intl, never hard-coded offsets.
    - path: "src/board.ts"
      instructions: >-
        Pure logic. Must not touch the DOM or browser storage. Every exported
        function needs a doc comment and tests in src/board.test.ts.
    - path: "src/scramble.ts"
      instructions: >-
        Pure logic. Must not touch the DOM, timers or Math.random directly;
        randomness is passed in so tests stay repeatable. Tests in src/scramble.test.ts.
    - path: "src/cities.ts"
      instructions: >-
        City data only. Check each city's IANA time zone is the right one for that
        city, and that names are at most 13 characters (the board width).
    - path: "src/search.ts"
      instructions: >-
        Pure logic. Must not touch the DOM. Matching must ignore case and accents.
        Tests in src/search.test.ts.
    - path: "src/storage.ts"
      instructions: >-
        Pure: converts the board to and from text, never calls localStorage itself.
        Saved data is untrusted input and must be fully validated. Tests in src/storage.test.ts.
    - path: "src/home.ts"
      instructions: >-
        Pure logic. Must not read the browser's time zone itself (it's passed in),
        so tests don't depend on where they run. Tests in src/home.test.ts.
    - path: "src/watch.ts"
      instructions: >-
        Pure clock maths. Must not touch the DOM or read the time itself; the
        clock reading is passed in. Tests in src/watch.test.ts.
    - path: "src/modes.ts"
      instructions: >-
        Pure. Every mode needs a label (enforced by the Record type) and unknown
        hashes must fall back to World Time. Tests in src/modes.test.ts.
    - path: "src/stopwatch.ts"
      instructions: >-
        Pure. Must never read a clock; the current time is always passed in.
        Tests in src/stopwatch.test.ts.
    - path: "src/quotes.ts"
      instructions: >-
        Quotes must be short, correctly attributed, and from authors who died long
        ago (or proverbs), so there are no copyright concerns. Randomness is passed in.
    - path: "src/**/*.test.ts"
      instructions: >-
        Vitest. Prefer it.each tables for cases. Use fixed ISO dates ending in Z,
        never new Date() with no arguments, so results don't depend on when or
        where the tests run.
    - path: "src/main.ts"
      instructions: >-
        Wiring only: creates the pieces from src/ui and runs the clock. No logic here.
    - path: "src/ui/**"
      instructions: >-
        UI only. Logic belongs in a pure, tested module outside src/ui. Flag any
        innerHTML (text must go through textContent; XSS risk). localStorage only
        through local-storage.ts.
    - path: ".github/workflows/**"
      instructions: >-
        The job must stay named "test", because branch protection requires that check.

chat:
  auto_reply: true